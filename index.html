<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">RPS</a>

      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="game">
      <h1>Rock Paper Scissors</h1>
      
      <!-- game UI -->
     <div class="score-board">
    <p>Human Score: <span id="human-score">0</span></p>
    <p>Computer Score: <span id="computer-score">0</span></p>
    <p>Round: <span id="round-count">0</span></p>
    <p id="message"></p>
    <h3 id="winner"></h3>
</div>
<button id="play-again">Play Again</button>

      <h3>Choose your weapon!</h2>
      <button class="choice" data-choice="rock">
    <img src="assets/rock.svg" alt="Rock">
</button>
      <button class="choice" data-choice="paper">
    <img src="assets/paper.svg" alt="Paper">
</button>
      <button class="choice" data-choice="scissors">
    <img src="assets/scissors.svg" alt="Scissors">
</button>
    </section>

    <section id="about">
      <h2>About</h2>

      <!-- explanation -->
    </section>

    <section id="contact">
      <h2>Contact</h2>

      <!-- contact information -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 RPS</p>
  </footer>
</body>
</html>
